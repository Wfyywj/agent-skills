name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install reference validator
        run: python -m pip install -r requirements-ci.txt
      - name: Check skills
        run: python scripts/check_skills.py
      - name: Self-check retry evaluation
        run: python -B evals/retry/run.py self-check
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress './**/*.md'
          output: ${{ runner.temp }}/lychee-report.md
